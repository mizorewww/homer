---
# ╔══════════════════════════════════════════════════════════════════════╗
# ║                     Homer Dashboard 配置文件                        ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# 此文件是 Homer 面板的核心配置。修改后会自动热更新（dev 模式下）。
#
# ── 基础设置 ─────────────────────────────────────────────────────────
#   title:            页面主标题（显示在 header 中）
#   subtitle:         页面副标题
#   header:           是否显示 header 区域（true / false）
#   footer:           底部 footer 内容（HTML 或 false 隐藏）
#   columns:          服务卡片列数（默认 3）
#   connectivityCheck: 是否启用网络连通性检测（true / false）
#
# ── 外观配置 ─────────────────────────────────────────────────────────
#   theme:        主题名称（default / walkxcode / neon）
#   accentColor:  全局主题色（十六进制色值，如 "#4285f4"）
#                 会覆盖 --highlight-primary / --highlight-secondary
#                 并作为 --accent-color 在自定义组件中使用
#   colors:       自定义颜色变量（覆盖主题默认值）
#     light:
#       highlight-primary: "#..."
#     dark:
#       highlight-primary: "#..."
#
# ── defaults ─────────────────────────────────────────────────────────
#   layout:       布局模式 "columns"（列式）或 "list"（列表式）
#   colorTheme:   颜色主题 "auto" / "light" / "dark"
#
# ── navbar ───────────────────────────────────────────────────────────
#   menuPaddingX: 导航栏左右内边距（px 数字）
#
# ── links ────────────────────────────────────────────────────────────
#   导航栏快捷链接数组，每项包含：
#     name:   显示名称
#     icon:   FontAwesome 图标类名（如 "fab fa-github"）
#     url:    链接地址
#     target: 打开方式（"_blank" / "_self"）
#
# ── services ─────────────────────────────────────────────────────────
#   服务卡片分组，每组包含：
#     name:  分组名称
#     icon:  FontAwesome 图标类名
#     items: 服务项数组
#       name:     服务名称
#       icon:     FontAwesome 图标类名
#       subtitle: 描述文字（会完整显示，支持换行）
#       tag:      标签（鼠标悬停时显示）
#       url:      链接地址
#       target:   打开方式
#
# ── widgetProviders ──────────────────────────────────────────────────
#   侧边小组件的数据源配置（可复用）。
#   每个 widget 通过 provider 字段引用这里的键名。
#
# ── widgets ──────────────────────────────────────────────────────────
#   侧边小组件分组配置。
#   left:  左侧栏分组数组
#   right: 右侧栏分组数组
#
#   每个分组包含：
#     name:       分组名称
#     icon:       FontAwesome 图标类名（可选，和 simpleIcon 二选一）
#     simpleIcon: simpleicons.org 图标名称（可选）
#     items:      组件实例数组
#       type:     组件类型（"cryptoTicker" / "ipSkk"）
#       title:    组件标题
#       provider: 引用 widgetProviders 中的配置键
#
#   cryptoTicker 专用字段：
#     symbols:     币种代码数组（如 ["BTC", "ETH"]）
#     iconUrls:    自定义币种图标 URL（优先于 simpleIcons）
#     simpleIcons: 币种对应的 simpleicons 图标名
#
#   ipSkk 专用字段：
#     （无额外字段，由 provider 配置 API 地址）
#
# ── proxy ────────────────────────────────────────────────────────────
#   HTTP 代理地址（用于部分自定义服务请求），设 ~ 不使用

title: ""
subtitle: ""

header: true
footer: false
columns: 3
connectivityCheck: true

defaults:
  # columns, list
  layout: columns
  # auto, light, dark
  colorTheme: auto

theme: default
# 全局主题色 — 修改此值可改变整个页面的主题色
accentColor: "#4285f4"
colors: ~

navbar:
  menuPaddingX: 48

message: ~
links:
  - name: "Google"
    icon: "fab fa-google"
    url: "https://www.google.com"
    target: "_blank"
  - name: "GitHub"
    icon: "fab fa-github"
    url: "https://github.com"
    target: "_blank"

services:
  - name: "开发"
    icon: "fas fa-code"
    items:
      - name: "GitHub"
        icon: "fab fa-github"
        subtitle: "代码托管与开源社区"
        tag: "code"
        url: "https://github.com"
        target: "_blank"
      - name: "Stack Overflow"
        icon: "fab fa-stack-overflow"
        subtitle: "开发问题搜索"
        tag: "qa"
        url: "https://stackoverflow.com"
        target: "_blank"
      - name: "Vite"
        icon: "fa-solid fa-bolt"
        subtitle: "前端构建工具文档"
        tag: "docs"
        url: "https://vite.dev"
        target: "_blank"

  - name: "学习 & 工具"
    icon: "fas fa-book"
    items:
      - name: "MDN Web Docs"
        icon: "fa-solid fa-globe"
        subtitle: "Web 技术权威文档"
        tag: "docs"
        url: "https://developer.mozilla.org"
        target: "_blank"
      - name: "Vue.js"
        icon: "fab fa-vuejs"
        subtitle: "Vue 官方文档"
        tag: "frontend"
        url: "https://vuejs.org"
        target: "_blank"
      - name: "掘金"
        icon: "fa-solid fa-newspaper"
        subtitle: "中文技术社区"
        tag: "community"
        url: "https://juejin.cn"
        target: "_blank"

# ── 侧边小组件数据源 ────────────────────────────────────────────────
widgetProviders:
  okx:
    baseUrl: "https://www.okx.com"
    path: "/api/v5/market/ticker"
    quote: "USDT"
    refreshMs: 8000

  ipSkk:
    ipUrl: "https://api.ip.sb/ip"
    backupIpUrl: "https://api.ipify.org"
    geoipUrlBase: "https://api.ip.sb/geoip/"

# ── 侧边小组件分组 ──────────────────────────────────────────────────
widgets:
  left:
    - name: "Crypto"
      simpleIcon: "bitcoin"
      items:
        - type: "cryptoTicker"
          title: "OKX 实时行情"
          provider: "okx"
          symbols: ["BTC", "ETH", "SOL"]
          iconUrls:
            BTC: "https://cdn.coinglasscdn.com/static/img/coins/bitcoin-BTC.png"
          simpleIcons:
            BTC: "bitcoin"
            ETH: "ethereum"
            SOL: "solana"

  right:
    - name: "Network"
      simpleIcon: "cloudflare"
      items:
        - type: "ipSkk"
          title: "IP / Route"
          provider: "ipSkk"


proxy: ~